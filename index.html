<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <script>try{var t=localStorage.getItem("focusflow.theme");document.documentElement.dataset.theme=t==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <title>Focus Flow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" data-mode="focus">
    <button id="theme-toggle" class="theme-toggle" aria-label="Switch to light theme"></button>
    <h1>Focus Flow</h1>

    <div class="modes" aria-live="polite">
      <span class="mode" id="mode-focus">Focus</span>
      <span class="mode" id="mode-break">Break</span>
    </div>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"/>
        <circle class="progress" id="progress" cx="100" cy="100" r="90"/>
      </svg>
      <div class="time" id="time" role="timer">25:00</div>
    </div>

    <div class="controls">
      <button id="start" class="primary">Start</button>
      <button id="pause" class="secondary" disabled>Pause</button>
      <button id="reset" class="secondary">Reset</button>
    </div>
    <p class="hint">Press <kbd>Space</kbd> to start or pause</p>

    <section class="stats" aria-label="Today's focus stats">
      <div><strong id="stat-sessions">0</strong><span>sessions today</span></div>
      <div><strong id="stat-minutes">0</strong><span>focus minutes</span></div>
    </section>

    <section class="tasks" aria-label="Tasks">
      <input id="task-input" type="text" placeholder="Add a task and press Enter"
             maxlength="120" autocomplete="off" aria-label="New task">
      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
